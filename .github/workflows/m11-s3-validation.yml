name: M11 private S3 validation

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed main commit SHA approved for this one S3 run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m11-s3-validation
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Existing stdlib checks
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  s3:
    needs: offline
    if: >-
      github.repository == 'kcloud1/aws-factory-pilot' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.approved_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read existing pinned factory toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kcloud1/cloud-app-factory
          ref: 48ab0ffa8d5615822d6ab99c516709c42f1070b1
          path: _m11_factory
          persist-credentials: false
      - name: Reuse core installer on this independent runner
        env:
          M11_TOOL_PREFIX: ${{ runner.temp }}/m11-core
        run: |
          python3 scripts/core_toolkit.py --factory-dir _m11_factory --install core --prefix "$M11_TOOL_PREFIX"
          python3 scripts/core_toolkit.py --factory-dir _m11_factory --check core --prefix "$M11_TOOL_PREFIX"
      - name: OIDC, existing private bucket object proof and cleanup
        timeout-minutes: 5
        env:
          AWS_CLI_EXE: ${{ runner.temp }}/m11-core/bin/aws
          M11_AWS_ROLE_ARN: ${{ secrets.M11_AWS_ROLE_ARN }}
          M11_S3_BUCKET: ${{ vars.M11_S3_BUCKET }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: python3 scripts/s3_validation.py
